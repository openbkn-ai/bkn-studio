<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenBKN 业务溯源分析原型</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #172033;
      background: #f4f6fa;
      font-synthesis: none;
      --blue: #315efb;
      --blue-soft: #eef2ff;
      --green: #168158;
      --line: #e2e7f0;
      --muted: #737d92;
      --shadow: 0 12px 34px rgb(29 45 78 / 8%);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #f4f6fa; }
    button { font: inherit; }

    .page {
      min-height: 100vh;
      padding: 28px;
      background:
        radial-gradient(circle at 4% 0%, rgb(49 94 251 / 10%), transparent 27%),
        #f4f6fa;
    }

    .header, .title-line, .toolbar, .status-line, .operation-main, .operation-meta,
    .detail-head, .legend, .question-marker, .answer-marker {
      display: flex;
      align-items: center;
    }

    .header { justify-content: space-between; gap: 24px; margin-bottom: 20px; }
    .title-line { gap: 10px; }
    .brand-icon {
      display: grid; width: 34px; height: 34px; border-radius: 10px; place-items: center;
      color: white; background: linear-gradient(135deg, #315efb, #6c8cff); font-size: 18px;
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: -.025em; }
    .complete { padding: 3px 9px; border-radius: 999px; color: #14764e; background: #e8f7ef; font-size: 12px; }
    .subtitle { margin: 7px 0 0; color: #667087; font-size: 14px; }
    .snapshot { display: grid; gap: 5px; color: #7d8698; text-align: right; font-size: 11px; }
    .snapshot code { color: #3f4a61; }

    .toolbar {
      gap: 18px; margin-bottom: 16px; padding: 8px 10px; border: 1px solid var(--line);
      border-radius: 12px; background: rgb(255 255 255 / 90%);
    }
    .switch { display: flex; padding: 3px; border-radius: 9px; background: #edf0f5; }
    .switch button { padding: 7px 14px; border: 0; border-radius: 7px; color: #69738a; background: transparent; cursor: pointer; }
    .switch button.active { color: #23304a; background: white; box-shadow: 0 2px 7px rgb(27 40 69 / 10%); font-weight: 650; }
    .view-help { margin: 0; color: #7c8598; font-size: 12px; }

    .workspace { display: grid; grid-template-columns: minmax(0, 1.58fr) minmax(340px, .72fr); align-items: start; gap: 16px; }
    .workspace.collapsed { grid-template-columns: minmax(0, 1fr) 48px; }
    .main, .detail, .detail-rail { border: 1px solid var(--line); border-radius: 14px; background: white; box-shadow: var(--shadow); }
    .main { min-width: 0; overflow: hidden; }
    .hidden { display: none !important; }

    .timeline { display: grid; gap: 18px; padding: 18px; }
    .interaction { overflow: hidden; border: 1px solid #e4e8f1; border-radius: 12px; }
    .interaction-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; padding: 18px 20px; background: linear-gradient(115deg, #f4f7ff, #fff); border-bottom: 1px solid #edf0f5; }
    .eyebrow { color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .05em; }
    .interaction h2 { max-width: 820px; margin: 7px 0 0; font-size: 16px; line-height: 1.55; }
    .stats { display: grid; align-content: center; gap: 4px; min-width: 160px; text-align: right; }
    .stats strong { font-size: 18px; }
    .stats span { color: #747d90; font-size: 11px; }

    .rail { position: relative; padding: 18px 22px 22px 116px; }
    .rail::before { position: absolute; top: 27px; bottom: 32px; left: 94px; width: 2px; background: #dbe2f0; content: ""; }
    .question-marker, .answer-marker { position: relative; min-height: 30px; gap: 12px; color: #657086; font-size: 11px; }
    .marker-dot { position: absolute; z-index: 2; left: -37px; display: grid; width: 28px; height: 28px; border-radius: 50%; place-items: center; color: white; background: var(--blue); box-shadow: 0 0 0 4px white; font-weight: 700; }
    .answer-marker .marker-dot { background: #18a06b; }
    .step { position: relative; margin: 8px 0 12px; }
    .step::before { position: absolute; z-index: 2; top: 32px; left: -27px; width: 10px; height: 10px; border: 2px solid #7891e5; border-radius: 50%; background: white; box-shadow: 0 0 0 4px white; content: ""; }
    .gap { height: 20px; color: #9199aa; font-size: 10px; }
    .operation { width: 100%; padding: 12px 14px; border: 1px solid #e1e6ef; border-radius: 10px; color: inherit; background: white; text-align: left; cursor: pointer; transition: .16s ease; }
    .operation:hover, .operation.selected { border-color: #809bff; background: #f8faff; box-shadow: 0 6px 18px rgb(49 94 251 / 11%); transform: translateY(-1px); }
    .operation-main { gap: 9px; }
    .operation-main strong { font-size: 13px; }
    .target { padding: 2px 8px; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-size: 10px; }
    .condition { display: block; margin-top: 6px; overflow: hidden; color: #566177; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .operation-meta { gap: 14px; margin-top: 9px; color: #8a93a5; font-size: 10px; }
    .ok { color: var(--green); }
    .answer-marker { align-items: flex-start; padding-top: 7px; }
    .answer-marker strong { color: #273249; font-size: 12px; }
    .answer-marker p { margin: 5px 0 0; color: #59647a; font-size: 12px; line-height: 1.55; }

    .network { min-height: 620px; padding: 18px; overflow-x: auto; background: linear-gradient(#f0f3f8 1px, transparent 1px), linear-gradient(90deg, #f0f3f8 1px, transparent 1px), #fbfcfe; background-size: 24px 24px; }
    .legend { justify-content: flex-end; gap: 18px; margin-bottom: 14px; color: #747e92; font-size: 10px; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .legend i { width: 9px; height: 9px; border-radius: 50%; }
    .observed-mark { background: var(--blue); }
    .context-mark { border: 1px dashed #929eb4; background: white; }
    .columns { display: grid; grid-template-columns: repeat(4, minmax(175px, 1fr)); gap: 12px; min-width: 780px; }
    .column { position: relative; min-height: 520px; padding: 10px; border: 1px solid rgb(219 226 238 / 90%); border-radius: 12px; background: rgb(255 255 255 / 86%); }
    .column:not(:last-child)::after { position: absolute; z-index: 2; top: 77px; right: -17px; width: 20px; height: 1px; background: #aeb9cc; content: ""; }
    .column-head { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; color: #6c768a; font-size: 11px; font-weight: 700; }
    .column-head b { display: grid; width: 20px; height: 20px; border-radius: 6px; place-items: center; color: var(--blue); background: var(--blue-soft); }
    .node { display: grid; grid-template-columns: 24px minmax(0, 1fr) 10px; align-items: center; gap: 8px; width: 100%; margin-bottom: 8px; padding: 11px 10px; border: 1px solid #dfe5ef; border-radius: 9px; color: #4a566d; background: white; text-align: left; cursor: pointer; }
    .node:hover, .node.selected { border-color: var(--blue); box-shadow: 0 5px 14px rgb(49 94 251 / 12%); }
    .node .icon { font-size: 17px; }
    .node strong, .node small { display: block; }
    .node strong { overflow: hidden; color: #29354b; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .node small { margin-top: 3px; color: #8992a4; font-size: 9px; line-height: 1.35; }
    .root-node { border-color: #91a8fa; color: var(--blue); background: #f2f5ff; }
    .observed-node { border-left: 3px solid var(--blue); }
    .context-node { border-style: dashed; background: #fcfcfd; }
    .candidate { width: 100%; padding: 8px 9px; border: 0; border-radius: 7px; color: #788297; background: #f0f2f6; font-size: 10px; text-align: left; cursor: pointer; }
    .candidate-note { margin: 8px 2px; padding: 8px; border-radius: 7px; color: #7a6840; background: #fff8e8; font-size: 10px; line-height: 1.5; }
    .empty { margin: 34px 10px; color: #929aab; font-size: 10px; line-height: 1.5; text-align: center; }

    .detail { position: sticky; top: 16px; overflow: hidden; }
    .detail-head { justify-content: space-between; gap: 14px; padding: 18px 20px 14px; border-bottom: 1px solid #edf0f5; }
    .detail-head h2 { margin: 5px 0 0; font-size: 18px; }
    .collapse { display: grid; width: 32px; height: 32px; border: 0; border-radius: 8px; place-items: center; color: #59647a; background: #f0f2f6; cursor: pointer; }
    .status-line { gap: 12px; padding: 10px 20px; color: #6e788d; background: #f8fafc; font-size: 11px; }
    .status-line .success { color: var(--green); }
    .status-line.context { color: #687287; background: #f2f4f7; }
    .section { padding: 15px 20px; border-bottom: 1px solid #f0f2f6; }
    .section h3 { margin: 0 0 9px; color: #7c8598; font-size: 11px; }
    .section p { margin: 0; color: #354158; font-size: 12px; line-height: 1.6; }
    .facts { display: grid; gap: 8px; margin: 0; }
    .facts div { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 9px; }
    .facts dt { color: #8a93a5; font-size: 10px; }
    .facts dd { min-width: 0; margin: 0; overflow-wrap: anywhere; color: #344057; font-size: 11px; }
    .condition-box { padding: 10px 12px; border-left: 3px solid var(--blue); border-radius: 5px; color: #26334d; background: #f4f7ff; font-size: 12px; font-weight: 650; }
    .fields { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .fields span { padding: 3px 8px; border-radius: 999px; color: #657087; background: #f0f2f6; font-size: 10px; }
    details { border-bottom: 1px solid #edf0f5; }
    summary { padding: 13px 20px; color: #48546b; font-size: 12px; font-weight: 650; cursor: pointer; }
    pre { max-height: 250px; margin: 0 20px 16px; padding: 12px; overflow: auto; border-radius: 8px; color: #d8e2ff; background: #172033; font: 10px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    .detail-rail { position: sticky; top: 16px; display: grid; justify-items: center; gap: 12px; padding: 9px 7px 14px; color: #687287; font-size: 10px; writing-mode: vertical-rl; }
    .detail-rail button { writing-mode: horizontal-tb; }

    @media (max-width: 1000px) {
      .workspace { grid-template-columns: minmax(0, 1fr) 340px; }
      .interaction-head { grid-template-columns: 1fr; }
      .stats { text-align: left; }
      .main { overflow-x: auto; }
    }
    @media (max-width: 760px) {
      .page { padding: 15px; }
      .header, .toolbar { align-items: flex-start; flex-direction: column; }
      .snapshot { text-align: left; }
      .workspace, .workspace.collapsed { grid-template-columns: 1fr; }
      .detail, .detail-rail { position: static; }
      .detail-rail { writing-mode: horizontal-tb; }
      .rail { padding-left: 70px; }
      .rail::before { left: 48px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <div class="title-line"><span class="brand-icon">◇</span><h1>业务溯源分析</h1><span class="complete">完整</span></div>
        <p class="subtitle">Codex · 2 轮交互 · 9 次业务调用 · HD供应链业务知识网络_v3</p>
      </div>
      <div class="snapshot"><span>独立真实会话快照</span><code>conv_73fc12a00ac46933c3d8015616a1b1b3</code></div>
    </header>

    <div class="toolbar">
      <div class="switch" role="tablist" aria-label="视图切换">
        <button class="active" type="button" data-view="timeline" role="tab" aria-selected="true">时间链视图</button>
        <button type="button" data-view="network" role="tab" aria-selected="false">知识网络视图</button>
      </div>
      <p class="view-help" id="view-help">按真实发生顺序查看每轮问题、业务调用和结果</p>
    </div>

    <div class="workspace" id="workspace">
      <section class="main">
        <div class="timeline" id="timeline-view"></div>
        <div class="network hidden" id="network-view">
          <div class="legend"><span><i class="observed-mark"></i>本次会话已触达</span><span><i class="context-mark"></i>知识网络上下文</span></div>
          <div class="columns">
            <section class="column">
              <div class="column-head"><b>1</b>业务知识网络</div>
              <button class="node root-node" type="button" id="network-root"><span class="icon">◇</span><span><strong>HD供应链业务知识网络_v3</strong><small>本次会话唯一知识网络</small></span><span>›</span></button>
              <button class="candidate" type="button" id="candidate-toggle">⌕ 28 个探索候选</button>
              <p class="candidate-note hidden" id="candidate-note">Schema 搜索返回的候选仅用于探索；未被后续调用触达的内容不算业务依据。</p>
            </section>
            <section class="column"><div class="column-head"><b>2</b>本次触达对象</div><div id="object-column"></div></section>
            <section class="column"><div class="column-head"><b>3</b>关联关系</div><div id="relation-column"></div></section>
            <section class="column"><div class="column-head"><b>4</b>相邻对象</div><div id="adjacent-column"></div></section>
          </div>
        </div>
      </section>
      <aside class="detail" id="detail"></aside>
      <aside class="detail-rail hidden" id="detail-rail"><button class="collapse" type="button" id="expand-detail" aria-label="展开详情">‹</button><span>调用详情</span></aside>
    </div>
  </main>

  <script>
    const network = { id: "supplychain_hd0202", name: "HD供应链业务知识网络_v3" };
    const interactions = [
      {
        question: "使用 HD供应链业务知识网络_v3 查询物料 101-000015 有多少库存、分别分布在哪些仓库，以及这个物料的供应商是谁？",
        duration: "1分37.9秒", operationTime: "3.5秒", started: "11:01:45",
        answer: "物料 101-000015（HD401_外置电池）库存合计 1,756；已获得仓库分布，但现有采购订单中未匹配到可确认的供应商。",
        operations: [
          { key: "op-list-networks", title: "查找业务知识网络", time: "11:01:56", gap: "11.5秒", duration: "23毫秒", tool: "list_knowledge_networks", result: "定位到 HD供应链业务知识网络_v3。" },
          { key: "op-search-schema", title: "探索知识网络结构", time: "11:02:04", gap: "7.4秒", duration: "209毫秒", tool: "search_schema", condition: "围绕物料、库存、仓库、供应商检索 Schema", result: "返回 28 个对象、关系与行动候选；候选本身不作为实际使用依据。" },
          { key: "op-inventory", title: "查询库存分布", time: "11:02:21", gap: "17.7秒", duration: "638毫秒", tool: "run_sql", object: "库存", resource: "d9qpqpco8jec73ec20ug", condition: "物料编码 = 101-000015", fields: ["仓库", "库存状态", "库存数量合计"], result: "按仓库和库存状态汇总，库存合计 1,756。", sql: "SELECT warehouse, stock_status, SUM(inventory_qty) AS inventory_qty\nFROM {{d9qpqpco8jec73ec20ug}}\nWHERE material_code = '101-000015'\nGROUP BY warehouse, stock_status\nORDER BY warehouse, stock_status" },
          { key: "op-po", title: "按物料查询采购订单供应商", time: "11:02:30", gap: "8.1秒", duration: "695毫秒", tool: "run_sql", object: "采购订单", resource: "d9qpqpco8jec73ec210g", condition: "物料编号 = 101-000015", fields: ["供应商编号", "供应商名称", "订单数量合计"], result: "没有匹配到采购订单。", sql: "SELECT supplier_number, supplier_name, SUM(order_quantity) AS order_quantity\nFROM {{d9qpqpco8jec73ec210g}}\nWHERE material_number = '101-000015'\nGROUP BY supplier_number, supplier_name\nORDER BY order_quantity DESC" },
          { key: "op-po-fuzzy", title: "扩大条件查找采购订单", time: "11:02:38", gap: "7.4秒", duration: "543毫秒", tool: "run_sql", object: "采购订单", resource: "d9qpqpco8jec73ec210g", condition: "物料名称或编号包含 101-000015", fields: ["物料", "供应商", "订单数量"], result: "扩大匹配范围后仍无采购订单记录。", sql: "SELECT material_number, material_name, supplier_number, supplier_name, order_quantity\nFROM {{d9qpqpco8jec73ec210g}}\nWHERE material_name LIKE '%101-000015%' OR material_number LIKE '%101-000015%'\nLIMIT 20" },
          { key: "op-pr", title: "查询物料请购记录", time: "11:02:58", gap: "18.7秒", duration: "725毫秒", tool: "run_sql", object: "物料请购单", resource: "d9qpqpco8jec73ec2110", condition: "物料编号 = 101-000015", fields: ["物料", "供应商", "请购数量"], result: "检查请购记录以补充供应商线索。", sql: "SELECT material_number, material_description, supplier_number, supplier_name, requested_quantity\nFROM {{d9qpqpco8jec73ec2110}}\nWHERE material_number = '101-000015'\nLIMIT 50" },
          { key: "op-material", title: "查询物料对象", time: "11:03:05", gap: "7.0秒", duration: "96毫秒", tool: "query_object_instance", object: "物料", condition: "物料编码 = 101-000015", fields: ["物料编码", "物料名称"], result: "确认物料名称为 HD401_外置电池。" },
          { key: "op-po-name", title: "按物料名称再次查询供应商", time: "11:03:13", gap: "7.2秒", duration: "562毫秒", tool: "run_sql", object: "采购订单", resource: "d9qpqpco8jec73ec210g", condition: "物料名称 = HD401_外置电池", fields: ["供应商编号", "供应商名称", "订单数量合计"], result: "按物料名称查询仍未获得可确认供应商。", sql: "SELECT supplier_number, supplier_name, SUM(order_quantity) AS order_quantity\nFROM {{d9qpqpco8jec73ec210g}}\nWHERE material_name = 'HD401_外置电池'\nGROUP BY supplier_number, supplier_name\nORDER BY order_quantity DESC" }
        ]
      },
      {
        question: "分析对比900-000044和900-000063两款智能球阀的BOM物料差异，是否有共用物料？",
        duration: "30.7秒", operationTime: "667毫秒", started: "11:04:22",
        answer: "完成两款智能球阀的 BOM 明细对比：900-000044 有 1 条直接物料，900-000063 返回 5 条 BOM 明细，并据返回结果判断共用物料。",
        operations: [
          { key: "op-bom", title: "对比两款产品的 BOM 物料", time: "11:04:40", gap: "17.7秒", duration: "667毫秒", tool: "run_sql", object: "产品BOM", resource: "d9qpqpco8jec73ec20tg", condition: "父项物料编码 ∈ 900-000044, 900-000063", fields: ["父项物料", "BOM物料", "标准用量", "BOM层级", "替代信息"], result: "返回两款产品的 BOM 明细，用于比较差异与共用物料。", requestId: "req_7892c814-bd3a-45c5-83eb-6707f0279df1", operationId: "op_481d7266ea974c0d6d9e2165c9e29a43", sql: "SELECT parent_material_code, material_code, material_name, standard_usage,\n  usage_numerator, usage_denominator, bom_level, alt_method, alt_group_no, alt_priority\nFROM {{d9qpqpco8jec73ec20tg}}\nWHERE parent_material_code IN ('900-000044','900-000063')\nORDER BY parent_material_code, bom_level, seq_no, material_code" }
        ]
      }
    ];

    const objects = [
      { id: "material", name: "物料", count: 1, binding: "Agent 直接查询了该业务对象。" },
      { id: "inventory", name: "库存", count: 1, binding: "数据资源与对象数据源绑定一致，可确定性定位。" },
      { id: "po", name: "采购订单", count: 3, binding: "数据资源与对象数据源绑定一致，可确定性定位。" },
      { id: "pr", name: "物料请购单", count: 1, binding: "数据资源与对象数据源绑定一致，可确定性定位。" },
      { id: "bom", name: "产品BOM", count: 1, binding: "数据资源与对象数据源绑定一致，可确定性定位。" },
      { id: "supplier", name: "供应商", count: 0 },
      { id: "product", name: "产品", count: 0 }
    ];
    const relations = [
      { id: "material-inventory", name: "物料关联库存", source: "material", target: "inventory", mapping: "物料编码 → 物料编码" },
      { id: "po-supplier", name: "采购订单关联供应商", source: "po", target: "supplier", mapping: "供应商编号 → 供应商编码" },
      { id: "po-pr", name: "采购订单关联物料请购单", source: "po", target: "pr", mapping: "物料编号、来源单据 → 请购单" },
      { id: "product-bom", name: "产品关联产品BOM", source: "product", target: "bom", mapping: "产品物料编号 → BOM父项物料编码" },
      { id: "bom-material", name: "产品BOM关联物料", source: "bom", target: "material", mapping: "BOM物料编码 → 物料编码" }
    ];

    const allOperations = interactions.flatMap((item) => item.operations);
    const state = { view: "timeline", selection: { type: "operation", value: allOperations[2] }, objectId: "inventory", relationId: null, objectsExpanded: true, detailCollapsed: false };
    const byId = (id) => document.getElementById(id);
    const objectByName = (name) => objects.find((item) => item.name === name);
    const objectById = (id) => objects.find((item) => item.id === id);

    function fieldsHtml(fields) {
      return fields && fields.length ? `<div class="fields">${fields.map((field) => `<span>${field}</span>`).join("")}</div>` : "";
    }
    function factsHtml(rows) {
      return `<dl class="facts">${rows.filter((row) => row[1]).map((row) => `<div><dt>${row[0]}</dt><dd>${row[1]}</dd></div>`).join("")}</dl>`;
    }
    function renderDetail() {
      const detail = byId("detail");
      const selection = state.selection;
      if (selection.type === "relation") {
        const relation = selection.value;
        detail.innerHTML = `<header class="detail-head"><div><span class="eyebrow">知识网络关系</span><h2>${relation.name}</h2></div><button class="collapse" type="button" data-collapse aria-label="收起详情">›</button></header>
          <div class="status-line context">网络上下文，未记录为实际调用</div>
          <section class="section"><h3>它连接什么</h3><p>${objectById(relation.source).name} → ${objectById(relation.target).name}</p></section>
          <section class="section"><h3>关联条件</h3><div class="condition-box">${relation.mapping}</div></section>
          <section class="section"><h3>为什么展示</h3><p>这是对象在业务知识网络中的真实关系，用来解释可继续追溯的方向；当前 Trace 没有记录 Agent 调用过这条关系。</p></section>`;
      } else if (selection.type === "object") {
        const object = selection.value;
        detail.innerHTML = `<header class="detail-head"><div><span class="eyebrow">本次触达对象</span><h2>${object.name}</h2></div><button class="collapse" type="button" data-collapse aria-label="收起详情">›</button></header>
          <div class="status-line"><span class="success">● 已触达</span><span>${object.count} 次查询</span></div>
          <section class="section"><h3>如何定位</h3><p>${object.binding}</p></section>
          <section class="section"><h3>业务知识网络</h3><p>${network.name}</p></section>`;
      } else {
        const operation = selection.value;
        detail.innerHTML = `<header class="detail-head"><div><span class="eyebrow">当前业务动作</span><h2>${operation.title}</h2></div><button class="collapse" type="button" data-collapse aria-label="收起详情">›</button></header>
          <div class="status-line"><span class="success">● 已完成</span><span>${operation.duration}</span></div>
          <section class="section"><h3>做了什么</h3><p>${operation.result}</p></section>
          <section class="section"><h3>业务目标</h3>${factsHtml([["知识网络", network.name], ["对象", operation.object], ["定位方式", operation.resource ? "通过数据资源确定性映射到对象" : "接口直接返回"]])}</section>
          <section class="section"><h3>怎么调用</h3><div class="condition-box">${operation.condition || "无附加查询条件"}</div>${fieldsHtml(operation.fields)}</section>
          <section class="section"><h3>结果</h3><p>${operation.result}</p></section>
          ${operation.sql ? `<details><summary>⌘ 复现查询</summary><pre>${operation.sql}</pre></details>` : ""}
          <details><summary>技术信息</summary><div class="section">${factsHtml([["接口", operation.tool], ["Resource ID", operation.resource], ["Request ID", operation.requestId], ["Operation ID", operation.operationId]])}</div></details>`;
      }
      detail.querySelector("[data-collapse]").addEventListener("click", collapseDetail);
    }
    function collapseDetail() {
      state.detailCollapsed = true;
      byId("workspace").classList.add("collapsed");
      byId("detail").classList.add("hidden");
      byId("detail-rail").classList.remove("hidden");
    }
    function expandDetail() {
      state.detailCollapsed = false;
      byId("workspace").classList.remove("collapsed");
      byId("detail").classList.remove("hidden");
      byId("detail-rail").classList.add("hidden");
    }
    function renderTimeline() {
      byId("timeline-view").innerHTML = interactions.map((interaction, index) => `<section class="interaction">
        <header class="interaction-head"><div><span class="eyebrow">第 ${index + 1} 轮交互</span><h2>${interaction.question}</h2></div><div class="stats"><strong>${interaction.duration}</strong><span>${interaction.operations.length} 次调用 · 调用耗时 ${interaction.operationTime}</span></div></header>
        <div class="rail"><div class="question-marker"><span class="marker-dot">问</span><span>${interaction.started} · 交互开始</span></div>
          ${interaction.operations.map((operation) => `<div class="step"><div class="gap">+${operation.gap} 后</div><button class="operation ${state.selection.type === "operation" && state.selection.value.key === operation.key ? "selected" : ""}" type="button" data-operation="${operation.key}"><span class="operation-main"><strong>${operation.title}</strong>${operation.object ? `<span class="target">${operation.object}</span>` : ""}</span><span class="condition">${operation.condition || operation.result}</span><span class="operation-meta"><span>${operation.time}</span><span>◷ ${operation.duration}</span><span class="ok">● 完成</span></span></button></div>`).join("")}
          <div class="answer-marker"><span class="marker-dot">答</span><div><strong>Agent 输出</strong><p>${interaction.answer}</p></div></div>
        </div></section>`).join("");
      document.querySelectorAll("[data-operation]").forEach((button) => button.addEventListener("click", () => {
        state.selection = { type: "operation", value: allOperations.find((operation) => operation.key === button.dataset.operation) };
        renderTimeline(); renderDetail();
      }));
    }
    function renderObjects() {
      const observed = objects.filter((object) => object.count > 0);
      byId("object-column").innerHTML = state.objectsExpanded ? observed.map((object) => `<button class="node observed-node ${state.objectId === object.id ? "selected" : ""}" type="button" data-object="${object.id}"><span class="icon">▣</span><span><strong>${object.name}</strong><small>${object.count} 次实际查询</small></span><span>›</span></button>`).join("") : `<p class="empty">点击知识网络展开对象</p>`;
      document.querySelectorAll("[data-object]").forEach((button) => button.addEventListener("click", () => {
        state.objectId = button.dataset.object; state.relationId = null;
        state.selection = { type: "object", value: objectById(state.objectId) };
        renderNetwork(); renderDetail();
      }));
    }
    function renderRelations() {
      const visible = relations.filter((relation) => relation.source === state.objectId || relation.target === state.objectId);
      byId("relation-column").innerHTML = visible.length ? visible.map((relation) => `<button class="node context-node ${state.relationId === relation.id ? "selected" : ""}" type="button" data-relation="${relation.id}"><span class="icon">⌁</span><span><strong>${relation.name}</strong><small>网络上下文 · 未记录调用</small></span><span>›</span></button>`).join("") : `<p class="empty">选择一个对象查看真实关系</p>`;
      document.querySelectorAll("[data-relation]").forEach((button) => button.addEventListener("click", () => {
        state.relationId = button.dataset.relation;
        state.selection = { type: "relation", value: relations.find((relation) => relation.id === state.relationId) };
        renderNetwork(); renderDetail();
      }));
    }
    function renderAdjacent() {
      const relation = relations.find((item) => item.id === state.relationId);
      if (!relation) { byId("adjacent-column").innerHTML = `<p class="empty">选择一条关系查看另一端对象</p>`; return; }
      const adjacentId = relation.source === state.objectId ? relation.target : relation.source;
      const adjacent = objectById(adjacentId);
      byId("adjacent-column").innerHTML = `<button class="node context-node" type="button"><span class="icon">▣</span><span><strong>${adjacent.name}</strong><small>${objectById(state.objectId).name} 通过关系可达</small></span></button>`;
    }
    function renderNetwork() { renderObjects(); renderRelations(); renderAdjacent(); }
    function switchView(view) {
      state.view = view;
      document.querySelectorAll("[data-view]").forEach((button) => {
        const active = button.dataset.view === view;
        button.classList.toggle("active", active); button.setAttribute("aria-selected", String(active));
      });
      byId("timeline-view").classList.toggle("hidden", view !== "timeline");
      byId("network-view").classList.toggle("hidden", view !== "network");
      byId("view-help").textContent = view === "timeline" ? "按真实发生顺序查看每轮问题、业务调用和结果" : "从知识网络逐步展开本次会话实际触达的对象";
      if (view === "network" && state.selection.type === "operation" && state.selection.value.object) {
        const object = objectByName(state.selection.value.object); if (object) state.objectId = object.id;
      }
      if (view === "network") renderNetwork();
    }

    document.querySelectorAll("[data-view]").forEach((button) => button.addEventListener("click", () => switchView(button.dataset.view)));
    byId("network-root").addEventListener("click", () => { state.objectsExpanded = !state.objectsExpanded; renderNetwork(); });
    byId("candidate-toggle").addEventListener("click", () => byId("candidate-note").classList.toggle("hidden"));
    byId("expand-detail").addEventListener("click", expandDetail);
    renderTimeline(); renderDetail(); renderNetwork();
  </script>
</body>
</html>
