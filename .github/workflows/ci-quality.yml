name: ci-quality

# PRs run affected Vitest tests for fast feedback. Pushes to main and release
# branches retain the complete quality suite, so protected branches remain
# full regression gates. Keeping the two triggers disjoint also avoids
# duplicate same-repo PR runs for the same head SHA.
on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: ci-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # Vitest's --changed mode needs the PR base commit to be available.
        # A full history is also safer than relying on an event-specific
        # shallow-fetch edge case; protected branches still run the unchanged
        # full suite.
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: License header check
        run: node scripts/check-license-headers.mjs

      - name: Formatting check
        run: pnpm run format:check

      - name: Type-aware lint
        run: pnpm exec eslint . --config eslint.config.typechecked.js --max-warnings 0

      - name: Internationalization checks
        run: pnpm run i18n:check

      - name: Semantic text color checks
        run: pnpm run theme:check

      - name: Theme surface checks
        run: pnpm run theme:scan-surfaces

      - name: Select unit test scope
        id: unit-tests
        # Release PRs use the full suite just like direct release pushes.
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.base.ref, 'release/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # The dependency graph selects tests for ordinary feature-module
          # changes. Shared runtime and tooling changes can affect arbitrary
          # modules, so they deliberately retain the full suite on PRs.
          full_suite_pattern='^(src/(app|framework|shared|test)/|src/main\.tsx$|src/vite-env\.d\.ts$|vite\.config\.ts$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig[^/]*\.json$|eslint\.config[^/]*\.(js|mjs|cjs)$|prettier\.config[^/]*\.(js|mjs|cjs)$|\.github/workflows/)'

          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "PR base commit is unavailable; using the full unit test suite."
            echo "scope=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only "${BASE_SHA}" HEAD)
          if grep -Eq "$full_suite_pattern" <<< "$changed_files"; then
            echo "Shared runtime or tooling changed; using the full unit test suite."
            echo "scope=full" >> "$GITHUB_OUTPUT"
          else
            echo "Module-only change; using affected Vitest tests."
            echo "scope=affected" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_SCOPE: ${{ steps.unit-tests.outputs.scope || 'full' }}
        run: |
          set -euo pipefail

          if [ "$TEST_SCOPE" = "affected" ]; then
            # Dependency analysis can fail before tests run for packages that
            # are only reached while tracing a changed source file. Preserve
            # the regression gate by retrying the established full suite.
            pnpm exec vitest --run --changed "$BASE_SHA" || pnpm exec vitest --run
          else
            pnpm exec vitest --run
          fi

      - name: Boundary contract tests
        if: steps.unit-tests.outputs.scope == 'affected'
        run: |
          # These tests inspect source files with node:fs, so Vitest's import
          # graph cannot select them from changes to the files they enforce.
          # Discover all boundary-test files to keep this safety net in sync
          # when a boundary contract is added or renamed.
          mapfile -d '' -t boundary_tests < <(
            find . \
              \( -path './.git' -o -path './node_modules' -o -path './dist' -o -path './.claude' \) -prune -o \
              -type f \( -name '*boundary.test.ts' -o -name '*boundary.test.tsx' \) -print0 | sort -z
          )

          if [ "${#boundary_tests[@]}" -eq 0 ]; then
            echo "No boundary contract tests were discovered." >&2
            exit 1
          fi

          pnpm exec vitest --run "${boundary_tests[@]}"

      - name: Type check
        run: pnpm exec tsc -b --pretty false

      - name: Production build
        run: pnpm exec vite build

      - name: Production dependency audit
        run: pnpm audit --prod
