name: ci-version

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Git reference
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < VERSION)"
          if [[ "$REF_TYPE" == tag ]]; then
            tag="${REF_NAME#v}"
            [[ "$tag" == "$base" || "$tag" =~ ^"$base"-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]] || { echo "::error::tag v$tag is outside VERSION $base"; exit 1; }
            package="$(node -p "require('./package.json').version")"
            [[ "$package" == "$tag" ]] || { echo "::error::package.json version must equal tag v$tag"; exit 1; }
          else
            for ref in "${BASE_REF:-}" "${HEAD_REF:-$REF_NAME}"; do
              [[ "$ref" == release/* ]] || continue
              [[ "${ref#release/}" == "$base" ]] || { echo "::error::branch $ref disagrees with VERSION $base"; exit 1; }
            done
          fi
      - run: node scripts/check-version.mjs
