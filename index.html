<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon-dark.svg?v=openbkn-20260828" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%BASE_URL%favicon.ico?v=openbkn-20260710" sizes="any" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png?v=openbkn-20260710" media="(prefers-color-scheme: light)" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico?v=openbkn-20260710" />
    <script>
      (() => {
        const isDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
        const theme = isDark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>OpenBKN</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Deploy-time runtime config (overridable static file); must load before the bundle. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
